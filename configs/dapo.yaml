# Short-answer FinQA adaptation of DAPO; see docs/dapo.md for scope and sources.
model:
  name: Qwen/Qwen3.5-2B
  revision: 15852e8c16360a2fea060d615a32b45270f8a8fc
  loader: qwen3_5_text
  cache_dir: .cache/huggingface
  dtype: bfloat16
  device: auto
  attn_implementation: sdpa
  chat_template_kwargs:
    enable_thinking: false
seed: 42
data: data/processed/qwen35_control_grpo.jsonl
limit: null
sft_adapter: outputs/qwen3.5-2b/sft
max_prompt_tokens: 2048
dynamic_sampling:
  max_generation_batches: 32
overlong_buffer:
  length: 32
  penalty_factor: 1.0
tolerance:
  atol: 1.0e-06
  rtol: 0.001
training:
  output_dir: outputs/qwen3.5-2b/dapo
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 32
  num_generations: 8
  num_iterations: 2
  max_completion_length: 128
  learning_rate: 1.0e-06
  max_steps: 400
  warmup_steps: 10
  lr_scheduler_type: constant_with_warmup
  beta: 0.0
  epsilon: 0.2
  epsilon_high: 0.28
  disable_dropout: true
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  bf16: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  logging_steps: 1
  save_steps: 50
  save_total_limit: 2
  use_vllm: false
  optim: adamw_torch
  loss_type: dapo
  scale_rewards: group
  mask_truncated_completions: true
  ddp_find_unused_parameters: false
  ddp_timeout: 1800
  num_train_epochs: 1.0
  eval_strategy: steps
  eval_steps: 50
  save_strategy: steps
  per_device_eval_batch_size: 1
  load_best_model_at_end: true
  metric_for_best_model: numerical_accuracy
  greater_is_better: true
  num_generations_eval: 1
validation:
  data: data/processed/dev.jsonl
  limit: null
  generation:
    max_input_tokens: 2048
    max_new_tokens: 128
    do_sample: false
  tolerance:
    atol: 1.0e-06
    rtol: 0.001
